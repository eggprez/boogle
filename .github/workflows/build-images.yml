# Tests the app, then builds both container images and publishes them to
# GitHub's registry (ghcr.io) so a Docker host (e.g. TrueNAS "Install via
# YAML") can pull them ready-made:
#   ghcr.io/<owner>/boogle:latest          the web app + Claude Code CLI
#   ghcr.io/<owner>/boogle-searxng:latest  upstream SearXNG + Wikidata patch + settings.yml
#
# The image build only runs when the unit tests and the container smoke test
# pass, so the weekly rebuild can never publish a broken image.
name: Build images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: pick up upstream SearXNG / Claude Code updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  smoke:
    # Build the app image and drive it against a stub SearXNG: health must be
    # green and a search must render results (no Claude login needed).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./app
          load: true
          tags: boogle:smoke
          cache-from: type=gha,scope=boogle
      - name: Start stub SearXNG
        run: |
          node app/test/stub-searxng.mjs > stub.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9999/healthz && break; sleep 0.5; done
      - name: Start app
        run: |
          docker run -d --name boogle --network host \
            -e AUTH_MODE=none -e SEARXNG_URL=http://127.0.0.1:9999 -e PORT=8080 \
            -e PUBLIC_URL=http://127.0.0.1:8080 boogle:smoke
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
      - name: Exercise the app
        run: |
          set -euxo pipefail
          curl -fsS http://127.0.0.1:8080/api/health | tee health.json
          grep -q '"searxng":true' health.json
          curl -fsS 'http://127.0.0.1:8080/search?q=smoke+test' -o search.html
          grep -q 'Example result 1' search.html
          grep -q 'class="filter active"' search.html
          grep -q 'engine-note' search.html
          curl -fsS 'http://127.0.0.1:8080/search?q=smoke&tab=images' | grep -q 'img-card'
          curl -fsS 'http://127.0.0.1:8080/search?q=smoke&tab=videos' | grep -q 'data-embed='
          curl -fsS 'http://127.0.0.1:8080/search?q=smoke&t=week' | grep -q 'Example result 1'
          curl -fsS 'http://127.0.0.1:8080/suggest?q=st' | grep -q 'stub one'
          curl -fsS 'http://127.0.0.1:8080/opensearch.xml' | grep -q OpenSearchDescription
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/favicon?host=localhost')" = 404
          curl -fsS 'http://127.0.0.1:8080/search?q=!gh+hono' -o /dev/null -w '%{redirect_url}\n' | grep -q github.com
      - name: Logs on failure
        if: failure()
        run: docker logs boogle; cat stub.log

  build:
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boogle
            context: ./app
          - name: boogle-searxng
            context: ./searxng
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase owner (ghcr requires it)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
