# Builds both container images and publishes them to GitHub's registry (ghcr.io)
# so a Docker host (e.g. TrueNAS "Install via YAML") can pull them ready-made:
#   ghcr.io/<owner>/boogle:latest          the web app + Claude Code CLI
#   ghcr.io/<owner>/boogle-searxng:latest  upstream SearXNG + Wikidata patch + settings.yml
name: Build images

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly: pick up upstream SearXNG / Claude Code updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boogle
            context: ./app
          - name: boogle-searxng
            context: ./searxng
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (ghcr requires it)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
