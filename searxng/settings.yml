# SearXNG settings for Boogle. Everything not listed here comes from SearXNG's
# defaults (use_default_settings: true). The instance is private: only the
# boogle container can reach it, so the bot limiter is off and JSON is on.
#
# How SearXNG ranks: every merged result scores
#     Π(weights of the engines that returned it) × (#engines) × Σ 1/position
# so a page that two engines both list near the top beats anything a single
# engine returns, and weights matter far less than agreement. The app then
# re-sorts by that score (see app/src/rank.ts) because SearXNG's own grouping
# pass demotes results that carry a thumbnail. Measure any change here with
#     cd app && npm run eval -- engines      (per-engine health, latency, overlap)
#     cd app && npm run eval -- merged       (hit rate against scripts/eval-queries.json)
#
# Engine tuning (measured 2026-09-08 with app/scripts/search-eval.mjs):
#   web    google (google.com HTML) answers every query in ~0.4 s and is the
#          ranking to imitate, so it carries the top weight. Google CSE is a
#          second Google-derived list, so pages on both get the agreement
#          bonus. Brave, Bing and Yandex are independent indexes. Startpage switched
#          to Bing's index and SearXNG's parser currently returns nothing from
#          it; DuckDuckGo, Qwant and Mojeek answer server requests with a
#          CAPTCHA or an access-denied page. Reddit is pulled into web
#          results the way Google surfaces it (own API credentials
#          recommended, see below); Stack Overflow is off because its API
#          quota (300 requests/day per IP) kept it suspended.
#   images icon libraries (devicons, lucide) produced ~70% of results and stock
#          photo sites added unrelated photos; only real web-image engines stay.
#   videos vimeo was erroring; small federated sources removed.
#   timeout 5 s cap so one slow engine can't hold the page much longer.
use_default_settings: true

general:
  instance_name: "Boogle backend"
  debug: false
  enable_metrics: false

server:
  # Overridden by the SEARXNG_SECRET env var in docker-compose.yml.
  secret_key: "replaced-by-SEARXNG_SECRET-env"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  formats:
    - html
    - json
  # Autocomplete engine for the search box suggestions. Options include
  # google, duckduckgo, brave, wikipedia, startpage, qwant.
  autocomplete: "google"
  autocomplete_min: 2
  safe_search: 0
  default_lang: "auto"
  # After an upstream error SearXNG benches the engine for this long. The
  # defaults (3 min for a 429, an hour for a CAPTCHA) are sized for busy public
  # instances; on a single-user one they mostly mean "no Google for the next
  # hour because one request tripped a limit". Retry sooner instead.
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 60

outgoing:
  # Default per-engine timeout and the hard cap.
  request_timeout: 5.0
  max_request_timeout: 5.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

ui:
  static_use_hash: true
  default_locale: "en"
  results_on_new_tab: false

# Hostnames plugin: a host in low_priority scores zero, so it sinks to the end
# of the page without disappearing; high_priority scores as if every engine
# had listed it first; remove drops it. Patterns are regular expressions on
# the hostname.
hostnames:
  low_priority:
    - '(.*\.)?pinterest\.(com|[a-z]{2})$'   # image boards that never answer a web query
    - '(.*\.)?facebook\.com$'               # login-walled
    - '(.*\.)?quora\.com$'                  # login-walled, thin answers

engines:
  # ---------------------------------------------------------------- web ----
  - name: google
    disabled: false
    weight: 2.0
  # GOOGLE_CSE_ID on the container swaps in your own Programmable Search
  # Engine ID; entrypoint.sh fills in, or drops, the placeholder line. Only
  # an engine set to "search the entire web" makes sense here, and Google
  # stopped creating those on 2026-01-20 (new ones are capped at 50 sites;
  # existing whole-web ones end 2027-01-01). Without it SearXNG's shared
  # public ID is used, which Google rate-limits for everyone at once
  # ("unusual traffic" -> engine suspended) and which has the same end date.
  - name: google cse
    weight: 1.5
    CX: "__GOOGLE_CSE_ID__"
  # Your own Programmable Search Engine limited to up to 50 sites you trust
  # (GOOGLE_SITES_CSE_ID on the container; entrypoint.sh fills in the ID and
  # enables the engine). It runs alongside the general engines, so a hit on
  # one of your sites that Google also lists gets the agreement bonus, while
  # its solo picks stay low on the page.
  - name: google sites
    engine: google_cse
    shortcut: gs
    categories: [general, web]
    disabled: true  # boogle:google-sites
    weight: 0.7
    CX: "__GOOGLE_SITES_CSE_ID__"
  - name: brave
    weight: 1.0
  - name: bing
    disabled: false           # stands in for DuckDuckGo (same underlying index)
    weight: 1.0
  # Independent index; agrees with Google on ~20% of a top ten, so it mostly
  # acts as a tie-breaker. The low weight keeps its own picks near the bottom
  # of the page (measured: about half a Yandex-only result per page).
  - name: yandex
    disabled: false
    weight: 0.5
  - name: startpage
    disabled: true            # now serves Bing's index, and SearXNG's parser returns nothing from it (2026-09)
  - name: duckduckgo
    disabled: true            # CAPTCHA on every request; DDG results are Bing's anyway

  # Reddit, two ways. With REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET set on the
  # container (a free "script" app from reddit.com/prefs/apps) the official
  # API engine below runs and the archive fallback is switched off by
  # entrypoint.sh. Without credentials the official engine is not loaded and
  # search goes through pullpush.io, a third-party archive that rate-limits
  # hard (HTTP 429 -> suspended). Reddit threads also keep arriving via
  # Google/Brave/Bing either way.
  - name: reddit
    engine: reddit_oauth
    shortcut: re
    categories: [general, social media]
    weight: 0.8
    timeout: 6.0
  - name: reddit archive
    engine: json_engine
    shortcut: rea
    categories: [general, social media]
    disabled: false  # boogle:reddit-fallback
    search_url: https://api.pullpush.io/reddit/search/submission/?q={query}&size=20&sort=desc&sort_type=score
    results_query: data
    url_query: permalink
    url_prefix: https://www.reddit.com
    title_query: title
    content_query: selftext
    weight: 0.6
    timeout: 5.0
    about:
      website: https://pullpush.io
      use_official_api: false
      require_api_key: false
      results: JSON

  # Stack Overflow: the Stack Exchange API allows 300 anonymous requests a
  # day per IP and SearXNG's engine has no way to use a key, so it spent most
  # of its time suspended ("too many requests"). Google surfaces the same
  # threads, so it is off.
  - name: stackoverflow
    disabled: true
  # Translators and dictionaries: noise for a general search box, and slow.
  - name: lingva
    disabled: true
  - name: mymemory translated
    disabled: true
  - name: dictzone
    disabled: true
  # Kept: wikipedia (abstract card), wikidata (infobox), currency (instant answer)

  # ------------------------------------------------------------- images ----
  - name: google cse images
    weight: 2.0
    CX: "__GOOGLE_CSE_ID__"
  - name: startpage images
    weight: 1.5
  - name: brave.images
    weight: 1.0
  - name: bing images
    weight: 1.0
  - name: duckduckgo images
    weight: 1.0
  - name: devicons
    disabled: true
  - name: lucide
    disabled: true
  - name: artic
    disabled: true
  - name: openverse
    disabled: true
  - name: flickr
    disabled: true
  - name: pexels
    disabled: true
  - name: unsplash
    disabled: true
  - name: pinterest
    disabled: true
  - name: wikicommons.images
    disabled: true

  # --------------------------------------------------------------- news ----
  - name: google news
    weight: 2.0
  - name: brave.news
    weight: 1.0
  - name: bing news
    weight: 1.0
  - name: startpage news
    weight: 1.0
  - name: duckduckgo news
    disabled: true
  - name: wikinews
    disabled: true

  # ------------------------------------------------------------- videos ----
  - name: youtube
    weight: 2.0
  - name: google videos
    weight: 1.5
  - name: brave.videos
    weight: 1.0
  - name: bing videos
    weight: 1.0
  - name: duckduckgo videos
    weight: 1.0
  - name: vimeo
    disabled: true            # HTTP errors
  - name: sepiasearch
    disabled: true
  - name: wikicommons.videos
    disabled: true
  - name: dailymotion
    disabled: true
